apiVersion: apps/v1
kind: Deployment
metadata:
  name: item-deployment
  namespace: default
spec:
  selector:
    matchLabels:
      app: item
  replicas: 1
  template:
    metadata:
      labels:
        app: item
    spec:
      volumes:
        - name: app-env
          configMap:
            name: app-env
      containers:
        - name: item
          image: butternoei008/hello-sekai-shop-api:latest
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: app-env
              mountPath: /etc/env
          env:
            - name: APP_NAME
              value: "item"
            - name: DB_URL
              value: "mongodb://root:123456@host.docker.internal:27017"
            - name: GRPC_AUTH_URL
              value: "auth-service.default.svc.cluster.local:3000"
            - name: GRPC_PLAYER_URL
              value: "player-service.default.svc.cluster.local:3000"
            - name: GRPC_INVENTORY_URL
              value: "inventory-service.default.svc.cluster.local:3000"
            - name: GRPC_PAYMENT_URL
              value: "payment-service.default.svc.cluster.local:3000"
            - name: KAFKA_URL
              value: "host.docker.internal:9092"
